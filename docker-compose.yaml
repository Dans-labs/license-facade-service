services:
  fuseki:
    image: secoresearch/fuseki:4.10.0
    container_name: lfs-fuseki
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
      JVM_ARGS: ${FUSEKI_JVM_ARGS:--Xmx2g -Xms1g}
    volumes:
      - fuseki-data:/fuseki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - lfs-internal

  license-facade-service:
    container_name: lfs
#    image: ekoindarto/lfs:0.1.0-amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
    environment:
      APP_NAME: ${APP_NAME:-License Facade Service}
      EXPOSE_PORT: ${EXPOSE_PORT:-12104}
      BASE_DIR: /home/akmi/lfs
      URL_BASE: ${URL_BASE:-https://lfs.labs.dansdemo.nl/api/v1/licenses}
      FUSEKI_URL: ${FUSEKI_URL:-http://fuseki:3030}
      FUSEKI_USER: ${FUSEKI_USER:-}
      FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:-}
      FUSEKI_ENABLE: ${FUSEKI_ENABLE:-true}
      FUSEKI_CLEAR_ON_STARTUP: ${FUSEKI_CLEAR_ON_STARTUP:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      RELOAD_ENABLE: ${RELOAD_ENABLE:-false}
      LFS_ADMIN_TOKEN: ${LFS_ADMIN_TOKEN:-}
      LFS_CURATOR_TOKEN: ${LFS_CURATOR_TOKEN:-}
    ports:
      - "12104:12104"
    volumes:
      - ./conf:/home/akmi/lfs/conf:ro
      - ./logs:/home/akmi/lfs/logs
      - ./resources:/home/akmi/lfs/resources
    depends_on:
      fuseki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:12104/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - lfs-internal

volumes:
  fuseki-data:
    driver: local

networks:
  lfs-internal:
    driver: bridge
